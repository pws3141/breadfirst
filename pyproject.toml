[project]
name = "breadfirst"
version = "0.1.0"
description = "Live music listings for Berlin, Headfirst-style."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "jinja2>=3.1",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["breadfirst", "breadfirst.venues"]

[tool.setuptools.package-data]
breadfirst = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
